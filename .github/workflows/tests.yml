name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 on 2026-10-19 and
    # a CI run shouldn't change underneath the code without a commit saying so.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # A clean machine with only requirements.txt installed: this is what catches
      # a package the code imports but requirements.txt forgot.
      - run: pip install -r requirements.txt
      # No API keys are set here on purpose. The tests stub every network call.
      - run: python -m pytest tests -q
